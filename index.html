<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación - Sarahí & Enrique</title>
  <!-- Fuentes elegantes para invitación -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Ocupa la pantalla completa del celular */
    body {
      width: 100vw;
      height: 100dvh;
      background-color: #f6f3eb; /* Fondo cremoso suave */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    /* Contenedor adaptativo para cualquier resolución móvil */
    .screen-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Wrapper del sobre */
    .envelope-wrapper {
      position: relative;
      width: 90vw;
      max-width: 380px;
      height: 250px;
      perspective: 1000px;
    }

    /* Cuerpo principal del sobre con BORDES REDONDOS */
    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #a39583;
      border-radius: 20px; /* Bordes redondeados principales */
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* Tarjeta interior */
    .card {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      bottom: 10px;
      background-color: #fdfbf7;
      border-radius: 14px; /* Bordes redondos de la tarjeta */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 1;
      border: 1px solid #eae3d2;
    }

    /* Texto de la tarjeta */
    .names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 8vw, 3rem);
      color: #3b332a;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .date {
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      color: #6b6052;
      margin-top: 8px;
      letter-spacing: 2px;
      font-style: italic;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
    }

    /* Solapa superior desplegable con bordes suavizados */
    .flap-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 130px;
      transform-origin: top;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      overflow: hidden;
    }

    /* Triángulo de la solapa con punta redondeada */
    .flap-shape {
      position: absolute;
      top: -65px;
      left: 50%;
      width: 180px;
      height: 180px;
      background-color: #948674;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Bolsillo inferior/laterales con bordes redondos */
    .pocket-left {
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 220px;
      height: 220px;
      background-color: #a99c8a;
      transform: rotate(45deg);
      border-radius: 25px;
      z-index: 2;
    }

    .pocket-right {
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 220px;
      height: 220px;
      background-color: #a19482;
      transform: rotate(45deg);
      border-radius: 25px;
      z-index: 2;
    }

    .pocket-bottom {
      position: absolute;
      bottom: -110px;
      left: 50%;
      width: 260px;
      height: 260px;
      background-color: #b2a593;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 30px;
      z-index: 3;
    }

    /* Sello dorado redondo */
    .seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffe699 0%, #d4af37 60%, #997509 100%);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(255,255,255,0.3);
      z-index: 5;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* --- Estados de apertura automática --- */
    .envelope-wrapper.open .flap-container {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope-wrapper.open .seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
      pointer-events: none;
    }

    .envelope-wrapper.open .names,
    .envelope-wrapper.open .date {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope">
        
        <!-- Tarjeta Interior -->
        <div class="card">
          <div class="names">Sarahí & Enrique</div>
          <div class="date">27.09.2026</div>
        </div>

        <!-- Solapa Superior -->
        <div class="flap-container">
          <div class="flap-shape"></div>
        </div>

        <!-- Caras del Sobre -->
        <div class="pocket-left"></div>
        <div class="pocket-right"></div>
        <div class="pocket-bottom"></div>

        <!-- Sello Dorado -->
        <div class="seal"></div>

      </div>
    </div>
  </div>

  <script>
    // Apertura automática al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      const envelope = document.getElementById('envelopeWrapper');
      
      // Breve pausa inicial para dar efecto suave
      setTimeout(() => {
        envelope.classList.add('open');
      }, 700);
    });
  </script>

</body>
</html>
