<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación - Sarahí & Enrique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SOBRE A PANTALLA COMPLETA -->
  <div class="contenedor-sobre" id="contenedorSobre">
    <div class="sobre" id="botonAbrir">
      <img src="Imagenes/SolapaPartearriba.png" class="sobre-solapa" alt="Solapa Arriba">
      <img src="Imagenes/SolapaParteAbajo.png" class="sobre-abajo" alt="Sobre Abajo">

      <div class="InvitacionPequeña" id="invitacion">
        <span class="escritura-letraporletra" id="textoEscrito"></span>
      </div>
    </div>
    <p class="instruccion-clic">Haz clic para abrir</p>
  </div>

  <!-- SECCIÓN PRINCIPAL DE BIENVENIDA -->
  <section class="seccion-principal" id="seccionPrincipal">
    <h1 class="titulo-novios">Sarahí & Enrique</h1>
    <p class="subtitulo-boda">Nuestra Boda</p>

    <div class="tarjeta-foto">
      <img src="Imagenes/ImagenPrincipal.jpg" alt="Sarahí & Enrique" class="imagen-principal">
    </div>
  </section>
  <script src="scripts.js"></script>

</body>

</html>
